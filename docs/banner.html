<!doctype html>
<!-- Source of docs/social-preview.png (1280x640). GitHub shows it small, so the name is big and nothing important sits near the edges.
     Render: msedge --headless=new --window-size=1280,640 --screenshot=social-preview.png banner.html -->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: Montserrat; font-weight: 800; src: url(../jobhunt/static/vendor/fonts/montserrat-800.woff2) format("woff2"); }
  @font-face { font-family: Montserrat; font-weight: 700; src: url(../jobhunt/static/vendor/fonts/montserrat-700.woff2) format("woff2"); }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { position: relative; color: #f6f6f8; font-family: Montserrat, "Segoe UI", sans-serif; background: #111216; }
  .app { position: absolute; left: 640px; top: 74px; width: 1000px; border-radius: 18px; overflow: hidden;
         box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 40px 90px -20px rgba(0, 0, 0, .85); }
  .app img { display: block; width: 100%; }
  .text { position: absolute; left: 64px; top: 50%; width: 540px; transform: translateY(-50%); }
  .logo { display: block; width: 148px; height: 148px; margin-bottom: 26px; filter: drop-shadow(0 16px 34px rgba(0, 0, 0, .6)); }
  h1 { margin: 0; font-size: 78px; line-height: 1; font-weight: 800; letter-spacing: -3px; white-space: nowrap; }
  h1 span { color: #f04a3a; }        /* the phoenix's red */
  .tag { margin-top: 22px; font-size: 31px; line-height: 1.2; font-weight: 700; color: #e4e4ea; }
  .sub { margin-top: 16px; font-size: 22px; line-height: 1.35; font-weight: 700; color: #a4a7b2; }
</style></head>
<body>
  <div class="app"><img src="screenshots/dashboard-dark.png" alt=""></div>
  <div class="text">
    <img class="logo" src="../packaging/logo.png" alt="">
    <h1>JobQuest<span>.AI</span></h1>
    <div class="tag">Your AI co-pilot for the job hunt</div>
    <div class="sub">Find jobs. Track applications. Land interviews.</div>
  </div>
</body></html>

# JobQuest.AI settings. Your OpenAI key does NOT go here: add it on the Settings page (it is saved to
# C:\Users\<you>\.jobhuntai\.env, outside OneDrive) or put OPENAI_API_KEY in that .env yourself.

[search]
days = 14                     # keep postings first published in the last N days
max_years = 2                 # entry level: postings asking for 3+ years are dropped
roles = ["SDE", "ML"]         # ML also covers AI, data science and data engineering
include_internships = true

[ai]
model = "gpt-6-luna"          # OpenAI's lowest-cost current text model; any chat model ID works
reasoning_effort = "low"      # none | minimal | low | medium | high; dropped automatically if the model rejects it
max_jobs_per_refresh = 150    # cap on AI job checks per refresh (each posting is checked once, then cached)
concurrency = 4
# USD per 1M tokens (input, output), used only to show running cost. Update if OpenAI changes prices.
prices = { "gpt-6-luna" = [0.10, 0.50], "gpt-6.1-sol" = [2.0, 10.0], "gpt-6-astra" = [10.0, 50.0] }

[server]
port = 8000
auto_refresh_hours = 12      # opening the app starts a search if the last one is older than this

[sources]
# Turn whole sources on/off. Keyed sources switch on by themselves once a key is configured.
greenhouse = true
lever = true
ashby = true
smartrecruiters = true
workday = true
amazon = true
himalayas = false             # off: links go to Himalayas (behind a bot check), not the company, and many listings are low quality
adzuna = true
jsearch = true
jooble = true


<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobQuest.AI</title>
<script src="/static/theme.js"></script>
<link rel="icon" type="image/png" href="/static/icon.png">
<link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top app-nav">
  <div class="container-xxl">
    <a class="navbar-brand d-flex align-items-center gap-2 me-4" href="#/jobs">
      <span class="brand-mark"><img src="/static/icon.png" width="34" height="34" alt=""></span>
      <span class="lh-sm"><span class="brand-name">JobQuest<span class="text-accent">.AI</span></span>
        <small class="d-block brand-sub">Your AI co-pilot for the job hunt</small></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav nav-pills gap-1 me-auto my-2 my-lg-0" id="tabs"></ul>
      <button class="btn btn-link nav-slim-btn d-none d-lg-flex" data-act="nav-slim" aria-label="Collapse the menu"><i class="bi bi-layout-sidebar"></i></button>
    </div>
  </div>
  <div class="refresh-strip d-none" id="progress" role="status" aria-live="polite">
    <div class="container-xxl d-flex align-items-center gap-3 py-2 flex-wrap">
      <span class="fw-semibold" id="progress-label"></span>
      <div class="progress flex-grow-1" role="progressbar" aria-label="Search progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated" id="progress-bar"></div>
      </div>
      <span class="fw-bold progress-pct" id="progress-pct">0%</span>
      <span class="small text-body-secondary" id="progress-detail"></span>
    </div>
    <div class="container-xxl d-none lanes pb-2" id="progress-lanes"></div>
  </div>
</nav>

<header class="topbar">
  <h1 class="page-title" id="page-title">Jobs</h1>
  <button class="pal-btn" data-act="pal-open" aria-label="Search everything"><i class="bi bi-search"></i><span>Search</span><kbd>Ctrl K</kbd></button>
  <span class="llm-switch"></span>
      <div class="d-flex align-items-center gap-2 nav-tools">
        <a href="#/dashboard" id="target-pill" class="target-pill"></a>
        <span id="last-run" class="small text-body-secondary me-1"></span>
        <div class="dropdown theme-dd"><button class="btn btn-outline-secondary btn-theme" type="button" data-bs-toggle="dropdown" data-bs-display="static" id="theme-btn" aria-expanded="false" aria-label="Choose a theme" title="Theme"></button>
          <ul class="dropdown-menu dropdown-menu-end" id="theme-menu"></ul></div>
        <div class="btn-group find-group">
          <button class="btn btn-ink" type="button" data-action="refresh" id="refresh-btn"></button>
          <button class="btn btn-ink dropdown-toggle dropdown-toggle-split" type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" aria-label="Search mode" id="find-mode-btn"></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><h6 class="dropdown-header">Find…</h6></li>
            <li><button class="dropdown-item" data-action="find-mode" data-mode="jobs">Job openings</button></li>
            <li><button class="dropdown-item" data-action="find-mode" data-mode="cold">Cold emails<small class="d-block text-body-secondary">contacts printed in postings</small></button></li>
          </ul>
        </div>
      </div>
</header>
<main class="container-xxl pb-5" id="app" tabindex="-1"></main>

<footer class="container-xxl py-4 small text-body-secondary border-top">
  JobQuest.AI · Your AI co-pilot for the job hunt · India only · every link goes straight to the company's own job page
</footer>

<div class="modal fade" id="ai-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header border-0 pb-0"><button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body pt-0" id="ai-modal-body"></div></div></div></div>

<div class="offcanvas offcanvas-end detail-sheet" tabindex="-1" id="sheet" aria-label="Job details">
  <div class="offcanvas-header pb-0"><button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="offcanvas"><i class="bi bi-arrow-left"></i> Back to jobs</button></div>
  <div class="offcanvas-body" id="sheet-body"></div>
</div>

<div class="modal fade" id="ask-modal" tabindex="-1" aria-hidden="true" aria-labelledby="ask-title"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body">
  <h5 id="ask-title"></h5><p class="text-body-secondary mb-3" id="ask-body"></p>
  <div class="d-flex justify-content-end gap-2"><button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-sm btn-ink" id="ask-yes"></button></div></div></div></div></div>

<div class="modal fade" id="palette" tabindex="-1" aria-hidden="true" aria-label="Search everything"><div class="modal-dialog"><div class="modal-content palette">
  <input id="pal-in" class="form-control" placeholder="Search jobs, applications, pages and actions…" autocomplete="off" aria-label="Search">
  <div id="pal-list" class="pal-list"></div></div></div></div>

<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
  <div id="toast" class="toast app-toast border-0" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex"><div class="toast-body fw-medium" id="toast-body"></div>
      <button type="button" class="btn btn-sm btn-light fw-semibold my-auto d-none" id="toast-action"></button>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
  </div>
</div>

<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/shell.js"></script>
<script src="/static/dashboard.js"></script>
<script src="/static/workspace.js"></script>
<script src="/static/setup.js"></script>
</body>
</html>
